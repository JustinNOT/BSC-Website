<!-- 2. HTML structure (use IDs that match your VATimeline.init() options): -->
<div class="va-upload-wrap">
  <label for="vaFileInput">Upload MP4 for V/A</label>
  <input type="file" id="vaFileInput" accept="video/mp4">
  <span id="uploadStatus" class="va-upload-status"></span>
</div>
<video id="video" controls crossorigin="anonymous"></video>

<div class="va-chart-label">Valence</div>
<div class="va-chart-wrap">
  <canvas id="valenceChart"></canvas>
  <div class="va-playhead" id="valencePlayhead"></div>
</div>
<div class="va-chart-label">Arousal</div>
<div class="va-chart-wrap">
  <canvas id="arousalChart"></canvas>
  <div class="va-playhead" id="arousalPlayhead"></div>
</div>
